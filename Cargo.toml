[workspace]
# Use the latest resolver available
resolver = "3"
# Include both parts of the library in the workspace
members = [
    "deboa-smol",
    "deboa-test-utils",
]

[workspace.package]
edition = "2024"
authors = ["Rogerio Araújo <rogerio.araujo@gmail.com>"]
repository = "https://github.com/ararog/deboa-smol"
homepage = "https://github.com/ararog/deboa"
readme = "README.md"
license = "MIT OR Apache-2.0"
rust-version = "1.85.0"

[workspace.dependencies]
base64 = { version = "0.23.0" }
bytes = { version = "1.11" }
caramelo = "0.1.5"
cookie = { version = "0.18.2" }
deboa = { version = "0.1.5-beta.7" }
deboa-test-utils = { path = "deboa-test-utils" }
futures = { version = "0.3.34" }
futures-util = { version = "0.3.31", default-features = false }
hashbrown = "0.17.1"
http = "1"
http-body-util = "0.1"
hyper = { version = "1.11.1", features = ["client"], default-features = false }
hyper-body-utils = { version = "0.1.18", default-features = false }
hyper-util = { version = "0.1.21", features = [
  "client",
  "http1",
], default-features = false }
multer = "3.1.0"
rand = "0.10.3"
regex = "1.9.6"
rstest = "0.28.0"
serde = { version = "1.0.217", features = ["derive"] }
tackle = { version = "0.1.1"}
url = "2.5.8"

[profile.test]
lto = false

[profile.release]
strip = true
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
