[package]
name = "deboa-smol"
version = "0.1.4-beta.1"
edition = "2021"
authors = ["Rogerio Araújo <rogerio.araujo@gmail.com>"]
repository = "https://github.com/ararog/deboa-smol"
homepage = "https://github.com/ararog/deboa"
description = "A friendly rest client on top of hyper."
readme = "README.md"
license = "MIT OR Apache-2.0"
keywords = ["http", "networking", "client", "fetch", "rest-client"]
publish = true
rust-version = "1.85.0"

[package.metadata.docs.rs]
features = [
  "http2",
  "rust-tls",
  "default-rustls-provider",
  "default-rustls-verifier",
]

[features]
default = [
  "http2",
  "http3",
  "rust-tls",
  "default-rustls-provider",
  "default-rustls-verifier",
  "websockets",
]

# tls
rust-tls = [
  "rustls/tls12",
  "dep:rustls-native-certs",
  "dep:futures-rustls",
  "dep:rustls-pki-types",
]

webpki-rustls-verifier = ["__webpki_rustls_verifier"]
platform-rustls-verifier = ["__platform_rustls_verifier"]

default-rustls-verifier = ["__webpki_rustls_verifier"]
__webpki_rustls_verifier = ["dep:webpki-roots"]
__platform_rustls_verifier = ["dep:rustls-platform-verifier"]

# rustls providers
no-provider = []
aws-lc-rustls-provider = ["__rustls_aws_lc_rs"]
ring-rustls-provider = ["__rustls_ring"]

default-rustls-provider = ["__rustls_aws_lc_rs"]
__rustls_aws_lc_rs = ["futures-rustls/aws-lc-rs", "quinn/rustls-aws-lc-rs"]
__rustls_ring = ["futures-rustls/ring", "quinn/rustls-ring"]

native-tls = ["async-native-tls-ext/runtime-smol"]

# protocols
http2 = ["hyper/http2", "hyper-util/http2"]
http3 = [
  "dep:deboa-h3",
  "dep:futures",
  "dep:h3",
  "dep:h3-quinn",
  "quinn/runtime-smol",
  "hyper-body-utils/h3",
]

websockets = ["deboa-ws"]

[dependencies]
async-executor = { version = "1.13.3", default-features = false }
async-lock = "3.4.2"
async-native-tls-ext = { version = "0.6.0", optional = true, default-features = false }
base64.workspace = true
bytes.workspace = true
cookie = { version = "0.18.1" }
deboa.workspace = true
deboa-h3 = { path = "../../deboa-h3", optional = true }
#deboa-h3 = { version = "0.1.3-beta.1", optional = true }
deboa-tls = { path = "../../deboa-tls" }
#deboa-tls = { version = "0.1.0-beta.3" }
deboa-ws =  { path = "../../deboa-ws", optional = true }
#deboa-ws =  { version = "0.1.0-beta.3", optional = true }
futures = { version = "0.3.31", optional = true, default-features = false }
futures-rustls = { version = "0.26.0", optional = true, default-features = false }
futures-timeout = "0.2.1"
futures-util = { workspace = true, default-features = false }
h3 = { version = "0.0.8", optional = true, default-features = false }
h3-quinn = { version = "0.0.10", optional = true, default-features = false }
hashbrown.workspace = true
http.workspace = true
http-body = "1"
http-body-util.workspace = true
hyper = { workspace = true, features = ["client"], default-features = false }
hyper-body-utils.workspace = true
#hyper-body-utils = { version = "0.1.17", default-features = false }
hyper-util = { version = "0.1.20", features = [
  "client",
  "client-legacy",
], default-features = false }
indexmap = "2.11.4"
log = "0.4.34"
macro_rules_attribute = { version = "0.2.2", default-features = false }
quinn = { version = "0.11.11", optional = true, default-features = false }
rand.workspace = true
regex.workspace = true
rustls = { version = "0.23.5", optional = true, default-features = false }
rustls-native-certs = { version = "0.8.0", optional = true, default-features = false }
rustls-pki-types = { version = "1.13.2", optional = true, default-features = false }
rustls-platform-verifier = { version = "0.7.0", optional = true, default-features = false }
serde = { workspace = true, features = ["derive"] }
smol = { version = "2.0.2", default-features = false }
smol-hyper = { version = "0.1.0", default-features = false }
smol-macros = { version = "0.1.1", default-features = false }
url.workspace = true
urlencoding = "2.1.3"
webpki-roots = { version = "1.0.6", optional = true, default-features = false }

[dev-dependencies]
caramelo.workspace = true
criterion = { version = "0.8.2", features = [
  "html_reports",
  "async",
  "async_smol",
] }
deboa-test-utils = { workspace = true }
easyhttpmock-vetis-smol = { path = "../../easyhttpmock-vetis-smol", features = [
  "http2",
  #"http3",
  "rust-tls",
], default-features = false }
# easyhttpmock-vetis-smol = { version = "0.1.0", features = [
#   "http2",
#   #"http3",
#   "rust-tls",
# ], default-features = false }
futures-util = { workspace = true }
multer.workspace = true
rstest.workspace = true
smol = "2.0.2"
time = { version = "0.3.53" }
